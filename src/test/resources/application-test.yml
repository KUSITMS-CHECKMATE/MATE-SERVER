spring:
  datasource:
    url: jdbc:h2:mem:mate;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

jwt:
  secret: test-secret-key-for-integration-tests-123456
  tokens:
    ACCESS:
      expiration: 3600000
    REFRESH:
      expiration: 1209600000

claude:
  api:
    key: ${CLAUDE_API_KEY:}

toss:
  api:
    enabled: false
  promotion:
    answer:
      enabled: false
      promotion-code: test-answer-promotion
  crypto:
    decryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    aad: test-aad

security:
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers: []
    allow-credentials: true
    max-age-seconds: 3600
  token-encryption:
    key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
