spring:
  datasource:
    url: jdbc:h2:mem:mate;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

jwt:
  secret: test-secret-key-for-integration-tests-123456
  tokens:
    ACCESS:
      expiration: 3600000
    REFRESH:
      expiration: 1209600000

toss:
  api:
    enabled: false
  crypto:
    decryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    aad: test-aad

security:
  token-encryption:
    key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
