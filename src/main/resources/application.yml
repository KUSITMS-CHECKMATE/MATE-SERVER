spring:
  application:
    name: MATE
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

security:
  cors:
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers: []
    allow-credentials: true
    max-age-seconds: 3600

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: mate
    export:
      prometheus:
        enabled: true

claude:
  api:
    model: claude-sonnet-4-6
    min-response-threshold: 20
    analysis-concurrency: 5

mate:
  admin:
    hard-delete-key: hard-confirm
  pdf:
    base-url: http://localhost:3001
    timeout: 90s

toss:
  api:
    base-url: https://apps-in-toss-api.toss.im
    timeout:
      connect: 5s
      read: 5s

payment:
  bank-maintenance:
    enabled: false
    start: "23:30"
    end: "00:30"
