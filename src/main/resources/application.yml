spring:
  application:
    name: MATE
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# 로컬 기본 프로필에서도 JWT 발급·검증에 필요합니다. 운영은 application-prod.yml + JWT_SECRET 환경변수를 사용하세요.
jwt:
  secret: ${JWT_SECRET:local-dev-only-do-not-use-in-production-min-32-chars!!}
  tokens:
    ACCESS:
      expiration: 3600000
    REFRESH:
      expiration: 1209600000

toss:
  api:
    base-url: https://apps-in-toss-api.toss.im
    timeout:
      connect: 5s
      read: 5s
