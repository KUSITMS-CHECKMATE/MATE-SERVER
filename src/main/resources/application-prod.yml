spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ssl:
    bundle:
      pem:
        toss:
          keystore:
            certificate: ${TOSS_MTLS_CERT_PATH:false}
            private-key: ${TOSS_MTLS_KEY_PATH:false}

deploy:
  env: ${DEPLOY_ENV:prod}

toss:
  api:
    enabled: ${TOSS_API_ENABLED:true}
    ssl:
      enabled: ${TOSS_API_SSL_ENABLED:true}
      bundle: toss
  crypto:
    decryption-key: ${TOSS_CRYPTO_DECRYPTION_KEY:}
    aad: ${TOSS_CRYPTO_AAD:}

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

azure:
  storage:
    connection-string: ${AZURE_CONNECTION:}
    container-name: ${AZURE_CONTAINER_NAME:}

jwt:
  secret: ${JWT_SECRET:}
  tokens:
    ACCESS:
      expiration: 3600000
    REFRESH:
      expiration: 1209600000
