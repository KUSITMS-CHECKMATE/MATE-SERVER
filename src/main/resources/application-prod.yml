# prod: DB·JWT·스토리지 등은 External Secrets Operator가 Azure Key Vault에서 동기화한
# Kubernetes Secret(mate-app-secrets)을 Deployment envFrom으로 주입한다. Spring은 KV SDK 없이 표준 env만 사용.
# mTLS PEM은 mate-mtls-certs 볼륨 → TOSS_MTLS_CERT_PATH / TOSS_MTLS_KEY_PATH 파일 경로.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ssl:
    bundle:
      pem:
        toss:
          keystore:
            certificate: ${TOSS_MTLS_CERT_PATH:false}
            private-key: ${TOSS_MTLS_KEY_PATH:false}

deploy:
  env: ${DEPLOY_ENV:prod}

toss:
  api:
    enabled: ${TOSS_API_ENABLED:true}
    ssl:
      enabled: ${TOSS_API_SSL_ENABLED:true}
      bundle: toss

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

azure:
  storage:
    connection-string: ${AZURE_CONNECTION:}
    container-name: ${AZURE_CONTAINER_NAME:}

jwt:
  secret: ${JWT_SECRET:}
  tokens:
    ACCESS:
      expiration: 3600000
    REFRESH:
      expiration: 1209600000