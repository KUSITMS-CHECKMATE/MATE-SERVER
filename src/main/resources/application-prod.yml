# prod: DB·JWT·스토리지 등은 External Secrets Operator가 Azure Key Vault에서 동기화한
# Kubernetes Secret(mate-app-secrets)을 Deployment envFrom으로 주입한다. Spring은 KV SDK 없이 표준 env만 사용.
# mTLS PEM은 mate-mtls-certs 볼륨 → TOSS_MTLS_CERT_PATH / TOSS_MTLS_KEY_PATH 파일 경로.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  ssl:
    bundle:
      pem:
        toss:
          keystore:
            certificate: ${TOSS_MTLS_CERT_PATH:false}
            private-key: ${TOSS_MTLS_KEY_PATH:false}

logging:
  structured:
    format:
      console: ecs

deploy:
  env: ${DEPLOY_ENV:prod}

toss:
  api:
    enabled: ${TOSS_API_ENABLED:true}
    ssl:
      enabled: ${TOSS_API_SSL_ENABLED:true}
      bundle: toss
  iap:
    tiers:
      - goal-ppl: 30
        reward: 200
        sku: ${TOSS_IAP_SKU_30_200}
        display-amount: 11000
      - goal-ppl: 50
        reward: 200
        sku: ${TOSS_IAP_SKU_50_200}
        display-amount: 18370
      - goal-ppl: 100
        reward: 200
        sku: ${TOSS_IAP_SKU_100_200}
        display-amount: 36850
      - goal-ppl: 200
        reward: 200
        sku: ${TOSS_IAP_SKU_200_200}
        display-amount: 73370
      - goal-ppl: 300
        reward: 200
        sku: ${TOSS_IAP_SKU_300_200}
        display-amount: 110000
      - goal-ppl: 30
        reward: 300
        sku: ${TOSS_IAP_SKU_30_300}
        display-amount: 16500
      - goal-ppl: 50
        reward: 300
        sku: ${TOSS_IAP_SKU_50_300}
        display-amount: 27500
      - goal-ppl: 100
        reward: 300
        sku: ${TOSS_IAP_SKU_100_300}
        display-amount: 55000
      - goal-ppl: 200
        reward: 300
        sku: ${TOSS_IAP_SKU_200_300}
        display-amount: 110000
      - goal-ppl: 300
        reward: 300
        sku: ${TOSS_IAP_SKU_300_300}
        display-amount: 165000
      - goal-ppl: 30
        reward: 500
        sku: ${TOSS_IAP_SKU_30_500}
        display-amount: 27500
      - goal-ppl: 50
        reward: 500
        sku: ${TOSS_IAP_SKU_50_500}
        display-amount: 45870
      - goal-ppl: 100
        reward: 500
        sku: ${TOSS_IAP_SKU_100_500}
        display-amount: 91740
      - goal-ppl: 200
        reward: 500
        sku: ${TOSS_IAP_SKU_200_500}
        display-amount: 183370
      - goal-ppl: 300
        reward: 500
        sku: ${TOSS_IAP_SKU_300_500}
        display-amount: 275000
  promotion:
    provider: ${TOSS_PROMOTION_PROVIDER:mock}
    answer:
      enabled: ${TOSS_PROMOTION_ANSWER_ENABLED:true}
      promotion-code: ${TOSS_PROMOTION_ANSWER_CODE:}
  callback:
    basic-auth-header: ${TOSS_CALLBACK_BASIC_AUTH_HEADER:}
  crypto:
    decryption-key: ${TOSS_CRYPTO_DECRYPTION_KEY:}
    aad: ${TOSS_CRYPTO_AAD:}
  token:
    refresh-cache-ttl: ${TOSS_REFRESH_CACHE_TTL:1209600000}

claude:
  api:
    key: ${CLAUDE_API_KEY:}

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

azure:
  storage:
    connection-string: ${AZURE_CONNECTION:}
    public-container-name: ${AZURE_PUBLIC_CONTAINER_NAME:}
    private-container-name: ${AZURE_PRIVATE_CONTAINER_NAME:}
    upload-sas-expiry-minutes: ${AZURE_UPLOAD_SAS_EXPIRY_MINUTES:10}
    download-sas-expiry-minutes: ${AZURE_DOWNLOAD_SAS_EXPIRY_MINUTES:30}

jwt:
  secret: ${JWT_SECRET:}
  tokens:
    ACCESS:
      expiration: 3600000
    REFRESH:
      expiration: 1209600000

mate:
  pdf:
    base-url: http://mate-pdf
    timeout: 90s

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  token-encryption:
    key: ${TOKEN_ENCRYPTION_KEY:}
