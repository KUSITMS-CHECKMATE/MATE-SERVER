# mate와 동일한 이미지/시크릿을 쓰는 JDA Discord 봇 전용 단일 인스턴스.
# mate(replicas:2)는 DISCORD_BOT_ENABLED=false로 두고, 봇 게이트웨이 연결은 이 Deployment(replicas:1) 하나에서만 맺는다.
# 라벨을 app: mate가 아닌 app: mate-bot으로 분리해 mate Service(HTTP 트래픽)·PodDisruptionBudget 대상에서 제외한다.
# strategy: Recreate — RollingUpdate였다면 배포 중 신/구 pod가 잠깐 공존해 같은 봇 토큰으로 두 번 연결되는
# 문제(10062 Unknown interaction)가 배포할 때마다 재현되므로, 구 pod 종료 후 신 pod 기동을 강제한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate-bot
  labels:
    app: mate-bot
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mate-bot
  template:
    metadata:
      labels:
        app: mate-bot
    spec:
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: mate-bot
          image: kusitmsmateacr.azurecr.io/mate
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DISCORD_BOT_ENABLED
              value: "true"
            - name: TOSS_MTLS_CERT_PATH
              value: /mnt/mtls/cert.pem
            - name: TOSS_MTLS_KEY_PATH
              value: /mnt/mtls/key.pem
          envFrom:
            - secretRef:
                name: mate-app-secrets
          volumeMounts:
            - name: mtls-certs
              mountPath: /mnt/mtls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: mtls-certs
          secret:
            secretName: mate-mtls-certs
