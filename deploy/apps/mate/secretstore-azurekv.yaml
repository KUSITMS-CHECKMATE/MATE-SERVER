# Key Vault RBAC: 이 SecretStore가 쓰는 Entra 앱에 Key Vault Secrets User 부여 필요
# tenantId: terraform output -raw azure_tenant_id 값으로 바꾸거나, 아래 줄만 로컬에서 치환해 적용.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-key-vault
  namespace: mate
spec:
  provider:
    azurekv:
      tenantId: b0a59db2-2285-4bcc-9cc0-5117fef10ebe
      vaultUrl: https://kusitms-mate-keyvault.vault.azure.net/
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: ClientID
        clientSecret:
          name: eso-azure-credentials
          key: ClientSecret
