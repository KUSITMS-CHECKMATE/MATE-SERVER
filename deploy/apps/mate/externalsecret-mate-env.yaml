    - secretKey: TOSS_IAP_SKU_100_500
      remoteRef:
        key: toss-iap-sku-100-500
    - secretKey: TOSS_IAP_SKU_200_500
      remoteRef:
        key: toss-iap-sku-200-500
    - secretKey: TOSS_IAP_SKU_300_500
      remoteRef:
        key: toss-iap-sku-300-500
    - secretKey: TOSS_IAP_SKU_100_100
      remoteRef:
        key: toss-iap-sku-100-100
    - secretKey: TOSS_IAP_SKU_200_100
      remoteRef:
        key: toss-iap-sku-200-100
