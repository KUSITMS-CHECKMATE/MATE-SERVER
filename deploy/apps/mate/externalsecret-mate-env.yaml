# KV 시크릿 이름(kebab) → K8s Secret 키(Spring env) — Terraform keyvault 모듈 기본 슬롯과 동일.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mate-app-from-kv
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: SecretStore
  target:
    name: mate-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_URL
      remoteRef:
        key: db-url
    - secretKey: DB_USERNAME
      remoteRef:
        key: db-username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: db-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: discord-webhook-url
    - secretKey: AZURE_CONNECTION
      remoteRef:
        key: azure-storage-connection-string
    - secretKey: AZURE_CONTAINER_NAME
      remoteRef:
        key: azure-container-name
    - secretKey: CORS_ALLOWED_ORIGINS
      remoteRef:
        key: cors-allowed-origins
