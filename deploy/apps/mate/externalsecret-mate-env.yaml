# KV 시크릿 이름(kebab) → K8s Secret 키(Spring env) — Terraform keyvault 모듈 기본 슬롯과 동일.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mate-app-from-kv
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: SecretStore
  target:
    name: mate-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_URL
      remoteRef:
        key: db-url
    - secretKey: DB_USERNAME
      remoteRef:
        key: db-username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: db-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
    - secretKey: DISCORD_ERROR_WEBHOOK_URL
      remoteRef:
        key: discord-error-webhook-url
    - secretKey: DISCORD_TEST_ALERT_WEBHOOK_URL
      remoteRef:
        key: discord-test-alert-webhook-url
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: discord-bot-token
    - secretKey: DISCORD_ADMIN_COMMAND_CHANNEL_ID
      remoteRef:
        key: discord-admin-command-channel-id
    - secretKey: AZURE_CONNECTION
      remoteRef:
        key: azure-storage-connection-string
    - secretKey: AZURE_PUBLIC_CONTAINER_NAME
      remoteRef:
        key: azure-public-container-name
    - secretKey: AZURE_PRIVATE_CONTAINER_NAME
      remoteRef:
        key: azure-private-container-name
    - secretKey: CORS_ALLOWED_ORIGINS
      remoteRef:
        key: cors-allowed-origins
    - secretKey: REDIS_HOST
      remoteRef:
        key: redis-host
    - secretKey: REDIS_PORT
      remoteRef:
        key: redis-port
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: REDIS_SSL_ENABLED
      remoteRef:
        key: redis-ssl-enabled
    - secretKey: TOSS_CALLBACK_BASIC_AUTH_HEADER
      remoteRef:
        key: toss-callback-basic-auth-header
    - secretKey: TOSS_CRYPTO_DECRYPTION_KEY
      remoteRef:
        key: toss-crypto-decryption-key
    - secretKey: TOSS_CRYPTO_AAD
      remoteRef:
        key: toss-crypto-aad
    - secretKey: TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: token-encryption-key
    - secretKey: TOSS_PROMOTION_ANSWER_CODE
      remoteRef:
        key: toss-promotion-answer-code
    - secretKey: CLAUDE_API_KEY
      remoteRef:
        key: claude-api-key
    - secretKey: TOSS_IAP_SKU_30_200
      remoteRef:
        key: toss-iap-sku-30-200
    - secretKey: TOSS_IAP_SKU_50_200
      remoteRef:
        key: toss-iap-sku-50-200
    - secretKey: TOSS_IAP_SKU_100_200
      remoteRef:
        key: toss-iap-sku-100-200
    - secretKey: TOSS_IAP_SKU_200_200
      remoteRef:
        key: toss-iap-sku-200-200
    - secretKey: TOSS_IAP_SKU_300_200
      remoteRef:
        key: toss-iap-sku-300-200
    - secretKey: TOSS_IAP_SKU_30_300
      remoteRef:
        key: toss-iap-sku-30-300
    - secretKey: TOSS_IAP_SKU_50_300
      remoteRef:
        key: toss-iap-sku-50-300
    - secretKey: TOSS_IAP_SKU_100_300
      remoteRef:
        key: toss-iap-sku-100-300
    - secretKey: TOSS_IAP_SKU_200_300
      remoteRef:
        key: toss-iap-sku-200-300
    - secretKey: TOSS_IAP_SKU_300_300
      remoteRef:
