# 예시: 복사 후 실값 채우고 파일명을 eso-azure-credentials.yaml 로 두고 적용 (Git 커밋 금지).
#   cp deploy/apps/mate/samples/eso-azure-credentials.example.yaml /tmp/eso-azure-credentials.yaml
#   # 편집 후
#   kubectl apply -f /tmp/eso-azure-credentials.yaml
#
# Entra: Key Vault에 Secrets User가 있는 별도 앱 등록(SP) + client secret 발급 권장 (앱 MI와 분리).
apiVersion: v1
kind: Secret
metadata:
  name: eso-azure-credentials
  namespace: mate
type: Opaque
stringData:
  ClientID: "<eso-service-principal-app-client-id>"
  ClientSecret: "<eso-service-principal-client-secret>"
