# PEM은 파일로 마운트 (Deployment volume). KV 슬롯 toss-mtls-* 와 이름 일치.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mate-mtls-from-kv
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: SecretStore
  target:
    name: mate-mtls-certs
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: cert.pem
      remoteRef:
        key: toss-mtls-certificate
    - secretKey: key.pem
      remoteRef:
        key: toss-mtls-private-key
