apiVersion: monitoring.coreos.com/v1beta1
kind: AlertmanagerConfig
metadata:
  name: discord-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  route:
    receiver: discord
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 2h
    matchers:
      - name: severity
        matchType: "=~"
        value: warning|critical
  receivers:
    - name: discord
      slackConfigs:
        - apiURL:
            name: monitoring-alerts-secrets
            key: DISCORD_WEBHOOK_URL
          sendResolved: true
          title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
          text: >-
            {{ range .Alerts -}}
            *Namespace:* {{ .Labels.namespace }}{{ if .Labels.pod }} | *Pod:* {{ .Labels.pod }}{{ end }}
            \n*Severity:* {{ .Labels.severity }}
            \n*Summary:* {{ .Annotations.summary }}
            \n*Description:* {{ .Annotations.description }}
            \n
            {{ end }}
