apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mate-application
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mate-application.json: |
    {
      "id": null,
      "uid": "mate-application",
      "title": "MATE application 로그",
      "schemaVersion": 38,
      "version": 1,
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "",
      "tags": [],
      "links": [],
      "editable": true,
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "JVM Heap Memory",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "jvm_memory_used_bytes{application=\"mate\", area=\"heap\"}",
              "legendFormat": "__auto",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 1,
                "fillOpacity": 0, "gradientMode": "none", "showPoints": "auto",
                "pointSize": 5, "spanNulls": false, "axisPlacement": "auto",
                "axisColorMode": "text", "scaleDistribution": { "type": "linear" },
                "barAlignment": 0, "stacking": { "mode": "none", "group": "A" },
                "thresholdsStyle": { "mode": "off" },
                "hideFrom": { "legend": false, "tooltip": false, "viz": false }
              },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 80 }] }
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 }
        },
