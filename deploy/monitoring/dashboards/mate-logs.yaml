apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mate-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mate-logs.json: |
    {
      "id": null,
      "uid": "ad9xxvq",
      "title": "MATE 서버 로그",
      "tags": [],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "",
      "time": {
        "from": "now-90d",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 3,
          "title": "Exception 발생 로그",
          "type": "logs",
          "gridPos": { "x": 0, "y": 0, "w": 23, "h": 6 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": false,
            "prettifyLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "{namespace=\"mate\"} |~ \"(?i)(exception|Exception)\" | json | line_format \"[{{.log_level}}] {{.message}}{{if .error_type}} type={{.error_type}}{{end}} logger={{.log_logger}}\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "K8s 시스템 에러",
          "type": "logs",
          "gridPos": { "x": 0, "y": 6, "w": 23, "h": 6 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": false,
            "prettifyLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "{namespace=\"kube-system\"} |~ \"(?i)(error|failed|fatal|panic)\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "레벨별 로그 비율",
          "type": "gauge",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "sum by (log_level) (count_over_time({namespace=\"mate\"} | json | __error__=\"\" [1h]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 1,
          "title": "Error 로그 수 ",
          "type": "logs",
          "gridPos": { "x": 0, "y": 20, "w": 23, "h": 4 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": {
            "showTime": false,
            "showLabels": false,
            "wrapLogMessage": false,
            "prettifyLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "sum by (namespace) (count_over_time({namespace=\"mate\"} | json | log_level=\"ERROR\" [1m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "로그 스트림",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 23, "h": 5 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "{namespace=\"mate\"} | json | __error__=\"\" | log_level=\"ERROR\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "결제 로그",
          "type": "logs",
          "gridPos": { "x": 0, "y": 29, "w": 23, "h": 6 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": false,
            "prettifyLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "{namespace=\"mate\"} | json | log_logger=~ \"server.MATE.domain.payment.*\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Discord 봇 미발송 로그",
          "type": "logs",
          "gridPos": { "x": 0, "y": 35, "w": 23, "h": 6 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": false,
            "prettifyLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "{namespace=\"mate\"} | json | log_logger=\"server.MATE.global.discord.webhook.DiscordWebhookClient\" | log_level=\"WARN\"",
              "refId": "A"
            }
          ]
        }
      ]
    }
