# Grafana 대시보드 영속화 PVC — ArgoCD monitoring 앱이 관리.
# Helm(kube-prometheus-stack)은 existingClaim으로만 참조
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitoring-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
