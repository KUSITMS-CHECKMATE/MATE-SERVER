# release: monitoring. Grafana PVC는 deploy/monitoring/grafana-pvc.yaml (ArgoCD) → existingClaim 참조.
# Prometheus PVC는 StatefulSet VolumeClaimTemplate으로 Operator가 직접 관리.
grafana:
  deploymentStrategy:
    # RWO PVC는 단일 Pod만 마운트 가능 → RollingUpdate 대신 Recreate
    type: Recreate
  # local-path + 기존 볼륨 데이터 시 chown Permission denied → persistence와 독립된 키
  initChownData:
    enabled: false
  persistence:
    enabled: true
    type: pvc
    existingClaim: monitoring-grafana

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
