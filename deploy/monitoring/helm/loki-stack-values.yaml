fluent-bit:
  enabled: false
grafana:
  enabled: false
  sidecar:
    datasources:
      enabled: true
loki:
  enabled: true
  isDefault: false
  image:
    tag: 2.9.3
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  config:
    compactor:
      retention_enabled: true
      working_directory: /data/loki/compactor
    limits_config:
      retention_period: 336h
prometheus:
  enabled: false
promtail:
  enabled: true
