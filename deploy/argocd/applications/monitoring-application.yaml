# kube-prometheus-stack Helm 설치 후, ArgoCD `monitoring` 앱으로 Ingress·ServiceMonitor를 Sync합니다.
# Grafana/Prometheus/Loki Helm values는 deploy/monitoring/helm/ 및 README.md 참고.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KUSITMS-CHECKMATE/MATE-SERVER.git
    targetRevision: feat/ci
    path: deploy/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
