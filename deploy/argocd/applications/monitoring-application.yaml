# Ingress·ServiceMonitor Kustomize. kube-prometheus-stack/loki는 Helm(values: deploy/monitoring/helm/)으로 관리.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KUSITMS-CHECKMATE/MATE-SERVER.git
    targetRevision: feat/ci
    path: deploy/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
