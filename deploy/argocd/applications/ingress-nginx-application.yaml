# Argo에서 ingress-nginx Controller 설치.
# VM 기반 K8s라 ingress-nginx는 NodePort로 띄우고, Terraform Azure LB가 80/443을 NodePort로 전달한다.
# 외부 접근:
#   http(s)://<cloudflare-api-record> -> Azure LB:80/443 -> NodePort 30080/30443
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.12.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          service:
            type: NodePort
            nodePorts:
              http: 30080
              https: 30443
          admissionWebhooks:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
