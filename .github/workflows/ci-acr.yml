name: CI - build and push to ACR

on:
  push:
    branches: [feat/ci]
  pull_request:
    branches: [feat/ci]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  ACR_LOGIN_NAME_FALLBACK: kusitmsmateacr
  IMAGE_TAG: gha-${{ github.run_number }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mate: ${{ steps.filter.outputs.mate }}
      pdf: ${{ steps.filter.outputs.pdf }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            pdf:
              - 'pdf-server/**'
            mate:
              - '**'
              - '!pdf-server/**'

  mate:
    needs: changes
    if: needs.changes.outputs.mate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_REPOSITORY: mate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve ACR login server
        id: acr
        env:
          ACR_LOGIN_NAME_OVERRIDE: ${{ vars.ACR_LOGIN_NAME }}
        run: |
          NAME="${ACR_LOGIN_NAME_OVERRIDE}"
          if [ -z "$NAME" ]; then NAME="${ACR_LOGIN_NAME_FALLBACK}"; fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "login_server=${NAME}.azurecr.io" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run tests & bootJar
        run: chmod +x gradlew && ./gradlew test bootJar --no-daemon --stacktrace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mate image
        id: meta
        run: |
          REG="${{ steps.acr.outputs.login_server }}"
          IMG="${REG}/${IMAGE_REPOSITORY}"
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-12)"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "digest_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          docker build \
            -t "${IMG}:${SHORT_SHA}" \
            -t "${IMG}:${{ env.IMAGE_TAG }}" \
            .

      - name: Azure login (OIDC)
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR and push mate
        if: github.event_name == 'push'
        run: |
          az acr login --name '${{ steps.acr.outputs.name }}'
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.digest_tag }}"
          docker push "${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG }}"
          printf 'Pushed %s (%s variants)\n' "${{ steps.meta.outputs.image }}" "${{ steps.meta.outputs.digest_tag }} ${{ env.IMAGE_TAG }}"

  pdf:
    needs: changes
    if: needs.changes.outputs.pdf == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build mate-pdf image
        run: |
          docker build \
            -t kusitmsmateacr.azurecr.io/mate-pdf:${{ env.IMAGE_TAG }} \
            ./pdf-server

      - name: Azure login (OIDC)
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR and push mate-pdf
        if: github.event_name == 'push'
        run: |
          az acr login --name kusitmsmateacr
          docker push kusitmsmateacr.azurecr.io/mate-pdf:${{ env.IMAGE_TAG }}

  update-kustomization:
    needs: [changes, mate, pdf]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      (needs.mate.result == 'success' || needs.pdf.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update kustomization image tags for ArgoCD
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          MATE_BUILT: ${{ needs.mate.result == 'success' }}
          PDF_BUILT: ${{ needs.pdf.result == 'success' }}
        run: |
          FILE="deploy/apps/mate/kustomization.yaml"
          cd deploy/apps/mate

          UPDATED=()
          if [ "$MATE_BUILT" = "true" ]; then
            kustomize edit set image kusitmsmateacr.azurecr.io/mate:${IMAGE_TAG}
            UPDATED+=("mate")
          fi
          if [ "$PDF_BUILT" = "true" ]; then
            kustomize edit set image kusitmsmateacr.azurecr.io/mate-pdf:${IMAGE_TAG}
            UPDATED+=("mate-pdf")
          fi
          cd -

          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No image tag changes to commit."
            exit 0
          fi

          IFS=,
          COMMIT_TARGETS="${UPDATED[*]}"
          unset IFS

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(cd): update ${COMMIT_TARGETS} image tag(s) to ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
